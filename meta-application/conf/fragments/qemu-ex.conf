BB_CONF_FRAGMENT_SUMMARY = "qemu-ex"
BB_CONF_FRAGMENT_DESCRIPTION = "Minimal QEMU image with Exein/Pulsar security runtime"

# Enable BTF kernel support required by Pulsar/eBPF (provides /sys/kernel/btf/vmlinux)
DISTRO_FEATURES:append = " btf"

# Mask Docker/OCI-specific recipes not applicable to this configuration
BBMASK += "meta-application/recipes-core/webservice-python/webservice-container.bb"

# QEMU runtime memory allocation
QB_MEM = "-m 8G"
